<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Karum — the brand-operated expansion agent. A brand seed and a city go in, and doors, flagship corridors, collab partners, skip reasons, and a field route come out.">

  <!--
    Favicon, from the official brand kit. The adaptive SVG carries both the light
    (#0F4C4A) and dark (#6FC4BA) mark and switches on prefers-color-scheme, so it
    is listed first; the two 32 px PNGs are the fallback for browsers that do not
    take an SVG icon. See BRAND.md.
  -->
  <link rel="icon" href="favicon-adaptive.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.png" sizes="32x32" type="image/png" media="(prefers-color-scheme: light)">
  <link rel="icon" href="favicon-dark.png" sizes="32x32" type="image/png" media="(prefers-color-scheme: dark)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="karum">
  <link rel="apple-touch-icon" href="apple-touch-icon-180.png">
  <link rel="apple-touch-icon" href="apple-touch-icon-180-dark.png" media="(prefers-color-scheme: dark)">

  <!-- Browser chrome, in the guide's paper and dark-paper values. -->
  <meta name="theme-color" content="#F4F5F1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0D1514" media="(prefers-color-scheme: dark)">

  <!--
    Share card. The Open Graph spec wants an absolute URL, so this is the Firebase
    Hosting origin the client is published to (see README). Update it if the demo
    moves host.
  -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Karum">
  <meta property="og:title" content="Karum">
  <meta property="og:description" content="One empty shop in. Who to call, who to skip, and why.">
  <meta property="og:image" content="https://karum-512016.web.app/og-share-card-1200x630.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://karum-512016.web.app/og-share-card-1200x630.png">

  <title>karum</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
  You can customize the "flutter_bootstrap.js" script.
  This is useful to provide a custom configuration to the Flutter loader
  or to give the user feedback during the initialization process.

  For more details:
  * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
